[project]
name = "exegen-research"
version = "0.1.0"
description = "Research on personalized exercise generation and student confidence."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "psutil>=6,<8",
]

[project.optional-dependencies]
reproduction = [
    "pyautogen==0.3.1",
    "openai==1.54.0",
    "httpx==0.27.2",
]
prepare = [
    "torch==2.5.1",
    "transformers==4.47.1",
    "safetensors==0.4.5",
    "huggingface-hub==0.27.0",
]
research = [
    "scikit-learn==1.5.2",
    "pyyaml",
    "jinja2",
    "tqdm",
    "mlflow>=2.20,<3",
    "sqlalchemy>=2,<2.1",
    "datasets",
]
analysis = [
    "matplotlib>=3.9,<4",
]
tracking = [
    "mlflow==2.22.5",
    "sqlalchemy>=2,<2.1",
]
confidence = [
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["third_party", "src/author", "runtime"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
